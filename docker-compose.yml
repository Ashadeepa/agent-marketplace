services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-otel
    restart: unless-stopped
    user: root  # the image's default non-root user can't create subdirs under the mounted volume
    environment:
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    volumes:
      - jaeger-badger:/badger

volumes:
  jaeger-badger:
